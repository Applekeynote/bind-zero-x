<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1b2330"><title>BIND ZERO-X · Sign in</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/style.css"><script src="/assets/auth.js" defer></script></head>
<body class="auth-body"><main class="auth-panel"><div class="eyebrow">✦ BIND ZERO-X / FIELD ACCESS</div><h1 id="auth-title">Sign in to your lab<span class="heading-cursor">_</span></h1><p class="modal-intro" id="auth-intro">Your password. Your authenticator.</p><form id="auth-form"><label class="field" id="username-field">Username<input id="auth-username" value="operator" pattern="[a-z][a-z0-9_-]{2,31}" maxlength="32" autocomplete="username" required></label><label class="field" id="password-field">Password<input type="password" id="auth-password" minlength="14" maxlength="128" autocomplete="current-password" required></label><div id="enrollment" hidden><img id="auth-qr" alt="Scan this QR with your authenticator app"><label class="field">Authenticator setup key<input id="auth-secret" readonly autocomplete="off"></label></div><label class="field" id="code-field">Authenticator code<input id="auth-code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required placeholder="000000"></label><button class="button primary" id="auth-submit" type="submit">Sign in →</button><p class="error-message" id="auth-error" role="alert" hidden></p></form><a class="judge-login-link" href="/judge">Judge sign in</a><p class="auth-footer">BIND ZERO-X · OBSERVATION QUEST</p></main></body></html>
